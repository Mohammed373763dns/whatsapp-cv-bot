<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوت الفحص</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2300a884'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
  <div class="body">
    <aside class="side">
      <header class="side-head">
        <span class="logo" aria-hidden="true">✓</span>
        <div class="brand-text">
          <b>بوت الفحص</b>
          <div class="wa" id="wa"></div>
        </div>
        <label class="switch" title="تشغيل أو إيقاف البوت لكل الأرقام" aria-label="تشغيل البوت">
          <input type="checkbox" id="enabled">
          <span class="track"></span>
        </label>
        <button class="icon-btn" id="open-settings" title="الإعدادات" aria-label="الإعدادات"></button>
      </header>

      <div class="tabs" role="tablist">
        <button role="tab" data-view="chats">المحادثات</button>
        <button role="tab" data-view="requests">الطلبات <span class="tab-count" id="req-count"></span></button>
      </div>

      <div class="side-tools">
        <input type="search" id="q" placeholder="دوّر على اسم أو رقم" aria-label="بحث">
        <div class="select-wrap only-chats"><select id="filter" aria-label="فلترة المحادثات"></select></div>
        <div class="select-wrap only-requests"><select id="req-filter" aria-label="فلترة الطلبات">
          <option value="pending">المعلقة</option>
          <option value="all">الكل</option>
          <option value="sent">انبعتت</option>
          <option value="failed">فشلت</option>
          <option value="dismissed">متجاهلة</option>
        </select></div>
      </div>

      <div class="items only-chats" id="items"></div>
      <div class="items only-requests" id="req-list"></div>
    </aside>

    <section class="conv" id="conv">
      <div class="conv-empty">
        <div class="big">💬</div>
        <b>اختار محادثة</b>
        <p>نتائج الفحص اللي بتستناك بتطلع جوا المحادثة، تحت الرسائل.</p>
      </div>
    </section>
  </div>
</div>

<div class="overlay" id="qr" hidden></div>

<dialog id="settings">
  <form method="dialog" class="dlg">
    <div class="dlg-head"><b>الإعدادات</b><button class="icon-btn" value="close" aria-label="سكّر">✕</button></div>
    <label class="field">الرد الآلي لما الزبون يبعت سيرته للفحص
      <textarea id="ackText" rows="3"></textarea>
    </label>
    <label class="check"><input type="checkbox" id="autoSend"> إذا ما بعتت النتيجة، تنبعت لحالها بعد <input type="number" id="afterMin" min="0" max="1440" class="num"> دقيقة</label>
    <div class="row">
      <button type="button" class="btn primary" id="save">حفظ</button>
      <button type="button" class="btn danger" id="relink">تغيير رقم الواتس</button>
    </div>
  </form>
</dialog>

<dialog id="confirm">
  <form method="dialog" class="dlg">
    <b class="confirm-title" id="confirm-title"></b>
    <p class="confirm-text" id="confirm-text"></p>
    <div class="row end">
      <button class="btn" value="no">إلغاء</button>
      <button class="btn primary" value="yes" id="confirm-ok"></button>
    </div>
  </form>
</dialog>

<dialog id="lightbox"><img alt="صورة درجة الفحص"></dialog>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
